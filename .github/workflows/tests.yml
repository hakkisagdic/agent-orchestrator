name: tests
# Manual only, per environment, on the maintainer's word. GitHub bills macOS
# minutes at 10x and Windows at 2x; the suite already runs on every push locally
# through the repository's pre-push hook. Trigger one environment at a time:
#   gh workflow run tests -f os=windows-latest
#   gh workflow run tests -f os=macos-latest
#   gh workflow run tests -f os=ubuntu-latest
#   gh workflow run tests -f os=all
on:
  workflow_dispatch:
    inputs:
      os:
        description: "runner: windows-latest | macos-latest | ubuntu-latest | all"
        default: windows-latest
        type: choice
        options: [windows-latest, macos-latest, ubuntu-latest, all]
      python:
        description: "interpreter: 3.9 (support floor) | 3.11 | 3.12"
        default: "3.11"
        type: choice
        options: ["3.9", "3.11", "3.12"]
permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.os }} / Python ${{ inputs.python }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'all' && '["ubuntu-latest","macos-latest","windows-latest"]' || format('["{0}"]', inputs.os)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
