name: tests
# Manual only. GitHub bills macOS minutes at 10x and Windows at 2x; the suite runs
# on every push locally (the repository's pre-push hook, on the maintainer's Mac),
# so hosted runners are for what the Mac cannot do: Windows, and Linux on demand.
# Trigger: gh workflow run tests -f os=windows-latest
on:
  workflow_dispatch:
    inputs:
      os:
        description: "runner(s): windows-latest | ubuntu-latest | both"
        default: windows-latest
        type: choice
        options: [windows-latest, ubuntu-latest, both]
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'both' && '["ubuntu-latest","windows-latest"]' || format('["{0}"]', inputs.os)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
