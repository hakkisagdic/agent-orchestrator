name: tests
# The suite runs on GitHub's hosted runners, which cost nothing for a public repository:
#   - every push to main and every pull request: Ubuntu, on the Python 3.9 support floor and on 3.12;
#   - every Monday: macOS and Windows on 3.12;
#   - on demand, one environment or all:
#       gh workflow run tests -f os=windows-latest -f python=3.12
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      os:
        description: "runner: windows-latest | macos-latest | ubuntu-latest | all"
        default: windows-latest
        type: choice
        options: [windows-latest, macos-latest, ubuntu-latest, all]
      python:
        description: "interpreter: 3.9 (support floor) | 3.11 | 3.12"
        default: "3.12"
        type: choice
        options: ["3.9", "3.11", "3.12"]
permissions:
  contents: read
concurrency:
  # A newer push to the same branch makes an older run's answer moot.
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: ubuntu-latest / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  weekly:
    if: github.event_name == 'schedule'
    name: ${{ matrix.os }} / Python 3.12
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A Windows runner spawns processes slowest.
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  on-demand:
    if: github.event_name == 'workflow_dispatch'
    name: ${{ matrix.os }} / Python ${{ inputs.python }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'all' && '["ubuntu-latest","macos-latest","windows-latest"]' || format('["{0}"]', inputs.os)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
