# Publish to PyPI on a version tag.
#
# Only a tag on a commit main holds is published, and every action below is named by
# a commit, its release beside it: a tag or a branch can be moved to other code, and
# the publishing job holds the token PyPI trusts (RELEASE-PINNED).
#
# Trusted Publishing (OIDC), so no token exists anywhere: not in the repository,
# not in Actions secrets, not on anyone's laptop. GitHub proves the workflow's
# identity to PyPI directly. A leaked token is the ordinary way a package gets
# hijacked, and the cheapest fix is not to have one.
#
# One-time setup on pypi.org → Publishing → Add a pending publisher:
#   project: ao-orchestrator   owner: hakkisagdic   repo: agent-orchestrator
#   workflow: release.yml   environment: pypi
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # A tag publishes only what passed: the support floor and a current interpreter.
    strategy:
      fail-fast: true
      matrix:
        python: ['3.9', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '${{ matrix.python }}' }
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }      # main's history, to find the tagged commit in it
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade build
      - run: python -m build

      - name: A release is made from a tag on main
        # The workflow can be dispatched on any ref, and a branch named like a version
        # passed the check below: its code was published, and `gh release create` then
        # tagged main's head with that name, a release no tag reproduces. A tag on a
        # commit main never held publishes what never landed through review and CI.
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "a release is made from a version tag, and $GITHUB_REF is a $GITHUB_REF_TYPE" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME tags $GITHUB_SHA, which main does not hold: tag a commit on main" >&2
            exit 1
          fi

      - name: The tag must match the packaged version
        # A mismatch publishes a version nobody can reproduce from a tag, and PyPI
        # never lets that number be reused.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # pyproject.toml reads the version from src/ao/__init__.py; that line is the one to match.
          PKG=$(python -c "import re;print(re.search(r'^__version__ = \"([^\"]+)\"', open('src/ao/__init__.py').read(), re.M).group(1))")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG"

      - name: The adapters must actually be in the wheel
        # The one packaging failure a --help smoke test cannot catch: the code
        # ships, the data it reads does not, and every adapter lookup dies at the
        # user's first command.
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()
          n = len([x for x in names if '/adapters/' in x])
          assert n >= 15, f'only {n} adapter files in the wheel'
          print('ok:', n, 'adapters,', len(names), 'entries')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: dist, path: dist/ }

  pypi:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # the OIDC token that replaces an API token
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    # After PyPI, so the release never announces a version pip cannot install yet.
    needs: [build, pypi]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: dist, path: dist/ }
      - name: Publish the release and print the Homebrew hash
        # The formula needs the sha256 of the source tarball for this tag, and
        # computing it by hand after the fact is how a formula ends up pinned to
        # the wrong archive.
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes
          sleep 5
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          echo "homebrew sha256 for $URL"
          curl -sL "$URL" | shasum -a 256
        env:
          GH_TOKEN: ${{ github.token }}
