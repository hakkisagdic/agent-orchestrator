[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ao-orchestrator"
version = "0.4.0"
description = "Attach to the coding agent you are already running: watch it, restart it, verify its work, and decide what may be committed."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["ai", "agents", "orchestration", "claude", "codex", "kiro", "mcp", "a2a"]
authors = [{ name = "Hakki Sagdic" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

# No runtime dependencies for the core, on purpose. This watches agents on machines it
# does not control — often someone else's laptop, a CI box, a container — and every
# dependency is a thing that can be missing exactly there. 3.9 is the floor because
# that is what macOS ships, and `ao status` should work before anyone has installed
# anything at all. The rule is about the core (#82): docs/upstream.md sets out three
# tiers - the core on the standard library only, optional extras declared under
# [project.optional-dependencies] that report themselves unavailable when absent, and
# plugins or providers outside the package - and a test holds the core to it.
dependencies = []

[project.urls]
Homepage = "https://hakkisagdic.github.io/agent-orchestrator/"
Source = "https://github.com/hakkisagdic/agent-orchestrator"
Documentation = "https://github.com/hakkisagdic/agent-orchestrator/blob/main/docs/protocol.md"

[project.scripts]
ao = "ao.cli:main"
ao-watchdog = "ao.watchdog:main"

[tool.hatch.build.targets.wheel]
# The adapters directory lives inside the package, so it ships with it — no
# force-include, which only produced duplicate entries in the archive.
packages = ["src/ao"]

[tool.hatch.build.targets.sdist]
include = ["src/ao", "docs", "README.md", "README.tr.md", "LICENSE", "pyproject.toml"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# A reviewer ao runs as a tool over the staged candidate, on its own provider (#86). Tier two:
# absent, the reviewer reports itself unavailable and names this extra. pr-agent needs Python
# 3.12, above ao's floor, so on an older interpreter the extra installs nothing rather than fail.
pr-agent = ["pr-agent>=0.45.0; python_version >= '3.12'"]
